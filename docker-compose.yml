services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    privileged: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
